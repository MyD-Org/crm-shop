name: guard · repo público

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archivos, identificadores y URLs prohibidos
        run: bash .github/scripts/repo-guard.sh tree

      # Imagen oficial con versión fija (última release v8 al momento de ejecutar el Lote 2;
      # se consulta con `gh release view --repo gitleaks/gitleaks --json tagName` y se deja
      # escrita acá). gitleaks-action no se usa: exige licencia en repos de organización.
      - name: Secretos (gitleaks, historial completo)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --log-opts="--all" --config /repo/.gitleaks.toml /repo
