# Sync del espejo de contactos de Alegra (tabla alegra_contacts del CRM), por tramos.
# Llama a /api/cron/alegra-contactos-sync con CRON_SECRET una vez por minuto mientras alguna
# cuenta tenga padrón por leer (`done: false`). Cada llamada lee a lo sumo 3 páginas por
# (tenant, cuenta): /contacts admite ~5 requests por minuto por cuenta y el login del portal y
# el bot comparten ese cupo. Cada tenant tiene su cuenta principal y, si las hay, cuentas
# secundarias (sucursales con Alegra propio): se siguen, resumen y reintentan por clave
# tenant:cuenta, así la falla de una cuenta no marca fallida a la otra.
# Ver apps/admin/docs/FUNCIONALIDADES.md, "Espejo de contactos de Alegra".

name: admin · Sync contactos Alegra

on:
  schedule:
    # Una vez por SEMANA, la noche del sábado al domingo: domingo 03:15 UTC (domingo 00:15 en
    # Argentina). Entre corridas el espejo lo mantienen los webhooks de Alegra; esta pasada es
    # el control (corrige avisos perdidos y da de baja lo que ya no está). Central LED (~200
    # páginas) tarda ~70 min, así que termina antes de las 06:00 UTC (catálogo del Shop) y de
    # las 07:00 UTC (catálogo del CRM), que usan la misma cuenta de Alegra.
    - cron: "15 3 * * 0"
  # A mano desde la pestaña Actions; `tenant` vacío = todos los tenants con Alegra y `cuenta`
  # vacío = todas las cuentas (principal y secundarias).
  workflow_dispatch:
    inputs:
      tenant:
        description: "Id de un tenant puntual (vacío = todos)"
        required: false
        default: ""
      cuenta:
        description: "Slug de una cuenta puntual, p. ej. mdp (vacío = todas)"
        required: false
        default: ""

permissions: {}

# Grupo COMPARTIDO con los otros workflows que usan la cuenta de Alegra: nunca corren en
# paralelo, el siguiente espera.
concurrency:
  group: alegra-cuenta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sincronizar contactos por tramos
        env:
          BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          CRON_SECRET: ${{ secrets.ADMIN_CRON_SECRET }}
          EVENTO: ${{ github.event_name }}
          # Por env y no interpolado en el script: el input lo escribe una persona.
          TENANT: ${{ github.event.inputs.tenant }}
          CUENTA: ${{ github.event.inputs.cuenta }}
          # Segundos entre el inicio de una ronda de llamadas y el de la siguiente.
          PAUSA_SEG: "60"
          # Tope del loop, por debajo de timeout-minutes para cerrar con resumen. Lo que no
          # termine hoy lo retoma la corrida siguiente (la pasada queda abierta con su cursor):
          # la de la semana próxima, o un Run workflow a mano antes.
          TOPE_SEG: "4800"
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secrets ADMIN_BASE_URL o ADMIN_CRON_SECRET del repo." >&2
            exit 1
          fi

          trigger="cron"
          if [ "$EVENTO" = "workflow_dispatch" ]; then trigger="manual"; fi
          uri() { jq -rn --arg t "$1" '$t|@uri'; }

          # Una llamada a la ruta; deja el cuerpo en response.json e imprime el HTTP status
          # ("000" si curl no llegó). --max-time 90 > maxDuration=60 de la ruta: si Vercel
          # corta, queremos ver su error, no un timeout de curl.
          llamar() {
            curl -sS -o response.json -w '%{http_code}' \
              --max-time 90 \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE_URL/api/cron/alegra-contactos-sync$1" || true
          }

          # Resumen para logs públicos: solo identificador de tenant y cuenta, estado y conteos.
          # Nunca el campo "error" ni datos de contactos.
          resumir() {
            jq -c '.tenants[] | {tenant, cuenta: (.cuenta // "principal"), ok, skipped, done, contactsSynced, totalPasada, markedInactive, requests}' response.json \
              || echo "(respuesta no resumible)"
          }

          # Una respuesta 200 que no es el JSON de la ruta (p. ej. una página HTML de por
          # medio) no puede pasar por "nada pendiente".
          respuesta_valida() {
            jq -e '.tenants | type == "array"' response.json > /dev/null 2>&1
          }

          # Claves tenant:cuenta que fallaron (ok:false sin skipped). Una cuenta salteada (p. ej.
          # sin_credenciales) no es una falla. Una respuesta sin `cuenta` es de la principal.
          fallidos=""
          anotar_fallidos() {
            for k in $(jq -r '.tenants[] | select(.ok == false and (.skipped != true)) | "\(.tenant):\(.cuenta // "principal")"' response.json); do
              fallidos="$fallidos $k"
            done
          }
          # Claves con padrón por leer: se las vuelve a llamar en la próxima ronda.
          pendientes_de() {
            jq -r '.tenants[] | select(.done == false and (.ok == true)) | "\(.tenant):\(.cuenta // "principal")"' response.json
          }

          # Primera ronda: todos los tenants y cuentas (o los del input) en una sola llamada.
          query="?trigger=$trigger"
          if [ -n "$TENANT" ]; then query="?tenant=$(uri "$TENANT")&trigger=$trigger"; fi
          if [ -n "$CUENTA" ]; then query="$query&cuenta=$(uri "$CUENTA")"; fi
          inicio=$(date +%s)
          ronda=$inicio
          http_code=$(llamar "$query")
          echo "HTTP $http_code"
          if [ "$http_code" != "200" ] || ! respuesta_valida; then
            echo "::error::La sincronización falló (HTTP $http_code o respuesta que no es la de la ruta)."
            exit 1
          fi
          resumir
          anotar_fallidos
          pendientes=$(pendientes_de)

          # Rondas siguientes: un tramo por (tenant, cuenta) pendiente, de a uno con
          # ?tenant=&cuenta=, cada PAUSA_SEG. Una clave que falla sale del loop; las demás siguen.
          while [ -n "$pendientes" ]; do
            if [ $(( $(date +%s) - inicio )) -ge "$TOPE_SEG" ]; then
              echo "::warning::Tope de tiempo con pasadas sin terminar ($(echo $pendientes)). La próxima corrida las retoma."
              break
            fi
            espera=$(( PAUSA_SEG - ($(date +%s) - ronda) ))
            if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
            ronda=$(date +%s)

            siguientes=""
            for k in $pendientes; do
              # La cuenta es lo que sigue al último ":"; el tenant, lo anterior.
              t="${k%:*}"
              c="${k##*:}"
              http_code=$(llamar "?tenant=$(uri "$t")&cuenta=$(uri "$c")&trigger=$trigger")
              if [ "$http_code" != "200" ] || ! respuesta_valida; then
                echo "{\"tenant\":\"$t\",\"cuenta\":\"$c\",\"http\":\"$http_code\"}"
                fallidos="$fallidos $k"
                continue
              fi
              resumir
              anotar_fallidos
              if [ -n "$(pendientes_de)" ]; then siguientes="$siguientes $k"; fi
            done
            pendientes=$(echo $siguientes)
          done

          if [ -n "$fallidos" ]; then
            echo "::error::Fallaron (tenant:cuenta):$fallidos. Ver el detalle de arriba y alegra_contacts_sync_log."
            exit 1
          fi
