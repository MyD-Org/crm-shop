# El endpoint /api/cron/alegra-sync existe pero no está en el "crons" de vercel.json:
# el plan Hobby topea la cantidad de cron jobs y solo permite una corrida por día.
# Se dispara desde acá, que además deja elegir la frecuencia. Ver AGENTS.md.

name: admin · Sync catálogo Alegra

on:
  # Programado desde el cutover de admin.
  schedule:
    # 07:00 UTC = 04:00 en Argentina. NO cambiar: la sync de apps/clientes corre a las 06:00 UTC contra la misma cuenta.
    - cron: "0 7 * * *"
  # Permite dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions: {}

# Grupo COMPARTIDO con clientes-catalogo-sync: las dos tareas usan la misma cuenta de Alegra
# (150 req/min por usuario). Nunca corren en paralelo; la segunda espera.
concurrency:
  group: alegra-cuenta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Acota cuánto retiene el grupo compartido si curl se cuelga; 320 s < 10 min, no altera
    # el comportamiento normal.
    timeout-minutes: 10
    steps:
      - name: Disparar la sincronización
        env:
          BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          CRON_SECRET: ${{ secrets.ADMIN_CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secrets ADMIN_BASE_URL o ADMIN_CRON_SECRET del repo." >&2
            exit 1
          fi

          # --max-time 320 > maxDuration=300 de la ruta: si Vercel corta, queremos ver su
          # error, no un timeout de curl. -sS calla la barra de progreso pero no los errores.
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/alegra-sync")

          echo "HTTP $http_code"

          # Resumen para logs públicos: solo identificador de tenant, ok y conteos numéricos.
          # Nunca el campo "error" (puede traer detalle interno de Alegra o del proveedor).
          jq -c '.tenants[] | {tenant, ok, itemsSynced, categoriesSynced}' response.json \
            || echo "(respuesta no resumible)"

          if [ "$http_code" != "200" ]; then
            echo "::error::La sincronización falló con HTTP $http_code"
            exit 1
          fi

          # La ruta responde 200 aunque un tenant falle (es best-effort por tenant):
          # hay que mirar el ok de cada uno para enterarse.
          if grep -q '"ok":false' response.json; then
            echo "::error::Al menos un tenant falló. Ver el detalle de arriba."
            exit 1
          fi
