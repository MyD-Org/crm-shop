name: admin · CI

on:
  pull_request:
    paths:
      - "apps/admin/**"
      # Los tests de integración aplican la baseline del Shop (esquema `shop`) y el test de
      # contrato compara contra ella: un cambio ahí tiene que disparar este CI.
      - "apps/clientes/drizzle/**"
      - ".github/workflows/admin-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      # Los tests de integración aplican la baseline del Shop (esquema `shop`) y el test de
      # contrato compara contra ella: un cambio ahí tiene que disparar este CI.
      - "apps/clientes/drizzle/**"
      - ".github/workflows/admin-ci.yml"

permissions:
  contents: read
  packages: read

# Un run por rama: si se pushea de nuevo, se cancela el anterior en vez de encolarlo.
concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin

    # Los tests de integración corren contra un Postgres real. El global-setup crea la DB
    # crm_test y le aplica las migraciones de drizzle solo; acá solo hace falta el servidor.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Sin healthcheck los tests pueden arrancar antes de que Postgres acepte conexiones.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # El helper db-url.ts exige host local y nombre con "test": es la red de seguridad para
      # que estos tests (que truncan tablas) nunca puedan apuntar a una base real.
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/crm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      # El .npmrc de apps/admin apunta @myd-org al registro de GitHub Packages y espera la
      # variable GITHUB_TOKEN para autenticarse (en local la tenés exportada; acá la da
      # Actions). El paquete tiene que tener a ESTE repo en "Manage Actions access" (si no:
      # E403). ADMIN_NPM_TOKEN es el plan B (PAT classic read:packages); si no existe, se usa
      # el token de Actions.
      - name: Instalar dependencias
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_NPM_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Lockfile intacto
        run: git diff --exit-code -- package-lock.json

      # Gate de lint: falla solo con errores. Quedan warnings de no-unused-vars que no rompen
      # el build; si en algún momento se limpian, se le puede agregar --max-warnings 0.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # test:all = unit + integration (los de rutas y permisos necesitan la DB de arriba).
      # Los tests de integración usan ./drizzle relativo al cwd: por eso working-directory.
      - name: Tests
        run: npm run test:all
