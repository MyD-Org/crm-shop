# La sync programada del catálogo corre COMPLETA dentro de este runner (apps/admin/scripts/
# alegra-sync.ts), no en una función de Vercel (tope de 300 s): cada tenant sincroniza su cuenta
# principal y las secundarias en un solo proceso, contra la base. El runner no tiene el caché de
# Next ni las credenciales del Shop: al terminar llama a /api/cron/alegra-sync/post-sync del CRM,
# que sólo avisa al Shop. La ruta por tramos (/api/cron/alegra-sync) queda para el botón
# "Sincronizar con Alegra" del admin. El endpoint no está en el "crons" de vercel.json (plan
# Hobby); se dispara desde acá, que además deja elegir la frecuencia. Ver AGENTS.md.

name: admin · Sync catálogo Alegra

on:
  # Programado desde el cutover de admin.
  schedule:
    # 07:00 UTC = 04:00 en Argentina. Es la única sync del catálogo: el Shop lo lee de las vistas del CRM.
    - cron: "0 7 * * *"
  # Permite dispararlo a mano desde la pestaña Actions. Sin inputs = todos los tenants, como el
  # cron. `aceptar_baja` (con `tenant`) acepta una baja masiva legítima que la guarda frenó
  # (corrida "parcial"; ver apps/admin/docs/FUNCIONALIDADES.md, "Sync incompleta").
  workflow_dispatch:
    inputs:
      tenant:
        description: "Id del tenant (vacío = todos)"
        type: string
        required: false
        default: ""
      aceptar_baja:
        description: "Aceptar que Alegra devuelva muchos menos productos y darlos de baja (requiere tenant)"
        type: boolean
        required: false
        default: false

# Sólo lo que necesita el `npm ci` para bajar @myd-org/ui de GitHub Packages (igual que admin-ci).
permissions:
  contents: read
  packages: read

# Grupo COMPARTIDO con los otros workflows que usan la cuenta de Alegra (150 req/min por
# usuario; hoy admin-alegra-contactos-sync). Nunca corren en paralelo; el siguiente espera.
concurrency:
  group: alegra-cuenta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Sin tope por función: la principal de Central Led sola tarda ~5 min y el total, unos
    # minutos más. Esto acota cuánto retiene el grupo compartido si algo se cuelga.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Validar secrets e inputs
        # Corre antes del checkout: `apps/admin` todavía no existe.
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
          BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          CRON_SECRET: ${{ secrets.ADMIN_CRON_SECRET }}
          # Inputs por env (nunca interpolados en el script). En el cron vienen vacíos.
          TENANT: ${{ inputs.tenant }}
          ACEPTAR_BAJA: ${{ inputs.aceptar_baja }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret ADMIN_DATABASE_URL del repo."
            exit 1
          fi
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Faltan los secrets ADMIN_BASE_URL o ADMIN_CRON_SECRET del repo."
            exit 1
          fi
          if [ -n "$TENANT" ] && ! printf '%s' "$TENANT" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::El tenant sólo admite letras, números, guiones y guiones bajos."
            exit 1
          fi
          if [ -z "$TENANT" ] && [ "$ACEPTAR_BAJA" = "true" ]; then
            echo "::error::aceptar_baja requiere indicar el tenant."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      # Misma autenticación que admin-ci: el .npmrc de apps/admin apunta @myd-org a GitHub
      # Packages y espera GITHUB_TOKEN. ADMIN_NPM_TOKEN es el plan B (PAT classic read:packages).
      - name: Instalar dependencias
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_NPM_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sincronizar catálogo
        id: sync
        env:
          DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
          NODE_ENV: production
          TENANT: ${{ inputs.tenant }}
          ACEPTAR_BAJA: ${{ inputs.aceptar_baja }}
        run: |
          args=()
          if [ -n "$TENANT" ]; then args+=(--tenant "$TENANT"); fi
          if [ "$ACEPTAR_BAJA" = "true" ]; then args+=(--aceptar-baja); fi
          npx tsx scripts/alegra-sync.ts "${args[@]}"

      # Corre aunque la sync haya fallado en algún tenant: los que sí terminaron cambiaron datos
      # y el Shop tiene que enterarse. El script deja en `avisar` los ids de esos tenants.
      - name: Avisar al Shop
        if: ${{ !cancelled() && steps.sync.outputs.avisar != '' }}
        env:
          BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          CRON_SECRET: ${{ secrets.ADMIN_CRON_SECRET }}
          AVISAR: ${{ steps.sync.outputs.avisar }}
        run: |
          fallidos=""
          for t in $AVISAR; do
            if ! printf '%s' "$t" | grep -Eq '^[A-Za-z0-9_-]+$'; then
              echo "::error::Id de tenant inválido en la lista."
              fallidos="$fallidos (id inválido)"
              continue
            fi
            http_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE_URL/api/cron/alegra-sync/post-sync?tenant=$t" || true)
            echo "aviso tenant=$t HTTP $http_code"
            if [ "$http_code" != "200" ]; then fallidos="$fallidos $t"; fi
          done
          if [ -n "$fallidos" ]; then
            echo "::error::No se pudo avisar al Shop de:$fallidos. Se actualiza solo con el próximo cambio o al vencer su caché."
            exit 1
          fi
