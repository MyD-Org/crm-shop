<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Columnas de Alegra</title>
    <style>
      :root {
        --texto: #1e293b;
        --suave: #64748b;
        --borde: #e2e8f0;
        --fondo: #ffffff;
        --acento: #30aba9;
        --fila: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--texto);
        background: var(--fondo);
      }
      header { padding: 14px 16px 10px; border-bottom: 1px solid var(--borde); }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      section { padding: 12px 16px; border-bottom: 1px solid var(--borde); }
      h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--suave); }
      label.check { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
      .nota { margin: 6px 0 0; font-size: 12px; color: var(--suave); }
      ol { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 8px; margin-bottom: 4px;
        border: 1px solid var(--borde); border-radius: 6px; background: var(--fila);
      }
      li label { flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 0; }
      li .nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li .tag { font-size: 10px; color: var(--acento); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
      li.oculta .nombre { color: var(--suave); text-decoration: line-through; }
      button {
        font: inherit; color: var(--texto); background: var(--fondo);
        border: 1px solid var(--borde); border-radius: 6px; cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--acento); color: var(--acento); }
      button:disabled { opacity: .35; cursor: default; }
      .mover { width: 26px; height: 24px; padding: 0; line-height: 1; }
      input[type="checkbox"] { accent-color: var(--acento); margin: 0; }
      footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 14px; }
      footer button { padding: 5px 10px; }
      #estado { font-size: 12px; color: var(--suave); }
    </style>
  </head>
  <body>
    <header><h1>Columnas de la grilla de ítems</h1></header>

    <section>
      <h2>Aplicar en</h2>
      <div id="docs"></div>
      <p class="nota">Facturas de venta usa otra pantalla en Alegra y no se puede personalizar.</p>
    </section>

    <section>
      <h2>Columnas</h2>
      <ol id="columnas"></ol>
      <p class="nota">Los cambios se aplican al instante en las pestañas de Alegra abiertas. La tecla Tab sigue el orden original.</p>
    </section>

    <footer>
      <span id="estado"></span>
      <button id="restablecer" type="button">Restablecer</button>
    </footer>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
