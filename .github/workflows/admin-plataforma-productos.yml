# Espejo de productos en la plataforma de catálogo externa.
# Llama a /api/cron/plataforma-productos con CRON_SECRET cada 15 minutos: empuja a la spec
# `producto` los productos que la sync de Alegra tocó desde el último cursor (incremental y
# convergente por clave; el primer pase hace el backfill). Sin `tenant` recorre todos los
# tenants que tienen la plataforma configurada.

name: admin · Plataforma productos

on:
  schedule:
    - cron: "7/15 * * * *"
  # A mano desde la pestaña Actions; `tenant` vacío = todos los tenants con plataforma.
  workflow_dispatch:
    inputs:
      tenant:
        description: "Id de un tenant puntual (vacío = todos)"
        required: false
        default: ""

permissions: {}

# Grupo PROPIO: un cron de 15 minutos no debe pisar el pendiente de otros workflows.
concurrency:
  group: admin-plataforma-productos
  cancel-in-progress: false

jobs:
  empujar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Empujar productos a la plataforma
        env:
          BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          CRON_SECRET: ${{ secrets.ADMIN_CRON_SECRET }}
          # Por env y no interpolado en el script: el input lo escribe una persona.
          TENANT: ${{ github.event.inputs.tenant }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secrets ADMIN_BASE_URL o ADMIN_CRON_SECRET del repo." >&2
            exit 1
          fi

          query=""
          if [ -n "$TENANT" ]; then query="?tenant=$(jq -rn --arg t "$TENANT" '$t|@uri')"; fi

          # --max-time 320 > maxDuration=300 de la ruta: si Vercel corta, queremos ver su error,
          # no un timeout de curl.
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 320 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/plataforma-productos$query" || true)
          echo "HTTP $http_code"

          if [ "$http_code" != "200" ] || ! jq -e '.tenants | type == "array"' response.json > /dev/null 2>&1; then
            echo "::error::El empuje falló (HTTP $http_code o respuesta que no es la de la ruta)."
            exit 1
          fi

          # Resumen para logs públicos: tenant, estado y conteos. Nunca el campo "error".
          jq -c '.tenants[] | {tenant, ok, enviados, fallidos, lotes}' response.json

          fallidos=$(jq -r '[.tenants[] | select(.ok == false) | .tenant] | join(" ")' response.json)
          if [ -n "$fallidos" ]; then
            echo "::error::Fallaron: $fallidos. Ver los logs de Vercel ([plataforma])."
            exit 1
          fi
