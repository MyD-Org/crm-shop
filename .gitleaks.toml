title = "crm-shop"

[extend]
useDefault = true

[[rules]]
id = "meta-access-token"
description = "Token de acceso de Meta / WhatsApp"
regex = '''EAA[A-Za-z0-9]{60,}'''

[[rules]]
id = "mercadopago-token"
description = "Access token de Mercado Pago"
regex = '''(APP_USR|TEST)-[0-9]{10,}-[0-9]{6}-[0-9a-f]{32}'''

[[rules]]
id = "resend-api-key"
description = "API key de Resend"
regex = '''re_[A-Za-z0-9]{8}_[A-Za-z0-9]{20,}'''

[[rules]]
id = "neon-password"
description = "Contraseña de rol de Neon"
regex = '''npg_[A-Za-z0-9]{12,}'''

[[rules]]
id = "postgres-url-con-password"
description = "Connection string de Postgres con contraseña"
regex = '''postgres(ql)?://[^\s:@/]+:[^\s@/]{6,}@'''
# Rellenos que NO son credenciales. La excepción mira solo la parte de la clave y es literal a
# propósito: una clave real nunca tiene la forma <MAYUSCULAS_Y_GUIONES> ni es este texto fijo.
# No se exceptúa por host ni por archivo: una URL real pegada en un doc o en un test tiene que
# seguir saltando.
[[rules.allowlists]]
description = "Marcadores de documentación (<PASSWORD>) y la clave de relleno de los tests"
regexTarget = "match"
regexes = [
  '''://[^\s:@/]+:<[A-Z][A-Z0-9_]*>@''',
  '''://[^\s:@/]+:s3cr3t-placeholder@''',
]

[[rules]]
id = "vercel-ids"
description = "IDs de team o proyecto de Vercel"
regex = '''(team|prj)_[A-Za-z0-9]{20,}'''

[[allowlists]]
description = "Lockfiles y tarball vendorizado"
paths = ['''package-lock\.json$''', '''apps/admin/vendor/.*\.tgz$''']

# Clave de mentira de los tests de firma del token del agente (apps/clientes). Es literal a
# propósito: solo este texto exacto queda exceptuado; cualquier otro valor sigue saltando.
[[allowlists]]
description = "Secreto de relleno de los tests del token del agente"
regexes = ['''^secreto-de-prueba-de-al-menos-32-caracteres$''']
