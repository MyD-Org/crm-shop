# Aviso de reingreso: manda el mail «Volvió a estar disponible» a quienes pidieron que se les avise.
#
# Corre desde acá y no desde Vercel Cron por la misma razón que `clientes-pagos-reconciliar.yml`: el
# plan Hobby de Vercel permite un solo cron y diario, y ese lugar lo ocupa la sync del catálogo
# (`vercel.json`). Cada 15 minutos alcanza: un aviso que llega algunos minutos tarde no pierde valor.
#
# El endpoint autentica con `Authorization: Bearer $CRON_SECRET`. Usa los mismos secrets que la
# reconciliación de pagos: CLIENTES_CRON_SECRET (tiene que coincidir con `CRON_SECRET` en Vercel
# Production del proyecto shop) y CLIENTES_BASE_URL. Con el flag `aviso-reingreso` apagado la ruta
# responde OK y no envía nada, así que este workflow puede quedar activo antes de prender el flag.
#
# El schedule de GH Actions no es puntual (puede atrasar o saltar corridas). Es seguro: cada aviso se
# reclama antes de enviarse y el envío lleva una clave de idempotencia, de modo que una corrida
# repetida o solapada no manda dos veces el mismo mail.

name: clientes · Aviso de reingreso

on:
  schedule:
    # Cada 15 minutos. GH Actions puede diferir en picos, es aceptable.
    - cron: "*/15 * * * *"
  # Para disparar a mano desde la UI de Actions cuando se prueba algo puntual.
  workflow_dispatch:

permissions: {}

# Si una corrida atrasa y coincide con la siguiente, la nueva espera a la que está en curso en vez de
# cancelarla: cortar un envío a mitad de camino dejaría avisos reclamados sin resolver.
concurrency:
  group: clientes-aviso-reingreso
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar al endpoint
        env:
          BASE_URL: ${{ secrets.CLIENTES_BASE_URL }}
          CRON_SECRET: ${{ secrets.CLIENTES_CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secrets CLIENTES_BASE_URL o CLIENTES_CRON_SECRET del repo." >&2
            exit 1
          fi
          # `-f` corta si el status es >= 400. `-sS` es silencioso pero muestra errores. `-o /dev/null -w`
          # para no volcar el cuerpo de la respuesta a logs públicos, solo el código HTTP.
          curl -fsS --max-time 120 \
            -o /dev/null -w 'HTTP %{http_code}\n' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/aviso-reingreso"
